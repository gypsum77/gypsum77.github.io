<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생물다양성 캠페인 · 모둠 모니터</title>
<style>
@font-face{font-family:'MapleL';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFLight.woff') format('woff'),url('https://cdn.jsdelivr.net/gh/fonts-archive/Maplestory/Maplestory-Light.woff2') format('woff2');font-display:swap}
@font-face{font-family:'MapleB';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff'),url('https://cdn.jsdelivr.net/gh/fonts-archive/Maplestory/Maplestory-Bold.woff2') format('woff2');font-display:swap}
:root{
  --green:#17824B; --green-d:#0C5B33; --green-l:#3FA96E;
  --mint:#EAF8EF; --mint2:#D6F0E0; --line:#C6E6D3;
  --ink:#16261E; --grey:#6B7B73;
  --amber:#B8730E; --amber-bg:#FFF7E6; --amber-line:#F2D9A6;
  --purple:#6A4BB5; --purple-bg:#F4F0FD; --purple-line:#DCD2F5;
  --fl:'MapleL','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --fb:'MapleB','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--fl);line-height:1.42;
  background:radial-gradient(1200px 520px at 50% -160px,#DCF2E4 0%,rgba(220,242,228,0) 72%),#F2F8F4;
  font-size:clamp(16px,1.35vw,24px)}
.wrap{min-height:100%;display:flex;flex-direction:column;padding:clamp(10px,1.1vw,20px);gap:clamp(8px,.9vw,16px)}

/* ── 머리 ── */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:linear-gradient(150deg,#0C5B33 0%,#17824B 58%,#2E9A5E 100%);color:#fff;
  border-radius:clamp(14px,1.4vw,22px);padding:clamp(12px,1.4vw,24px) clamp(16px,1.6vw,28px);
  box-shadow:0 12px 30px rgba(12,91,51,.22);position:relative;overflow:hidden}
.topbar:after{content:"🌿";position:absolute;right:-6px;bottom:-40px;font-size:clamp(70px,9vw,150px);opacity:.13;line-height:1}
.topbar .k{font-size:clamp(12px,.95vw,16px);opacity:.9;letter-spacing:.02em}
.topbar h1{margin:.15em 0 0;font-family:var(--fb);font-weight:normal;
  font-size:clamp(26px,3.1vw,52px);line-height:1.1;letter-spacing:-.01em}
.topbar h1 .hero{display:inline-block;margin-left:.25em;padding:.06em .38em;border-radius:.35em;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45)}
.topbar h1 .hero.pop{animation:pop .9s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.13)}100%{transform:scale(1)}}
.topbar .right{text-align:right;min-width:min(38%,340px)}
.clock{font-family:var(--fb);font-size:clamp(24px,2.6vw,44px);line-height:1;letter-spacing:.02em}
.mini{font-size:clamp(12px,.95vw,16px);opacity:.95;margin-top:.35em}
.mini b{font-family:var(--fb);font-weight:normal}
.badge-new{display:inline-block;margin-top:.4em;background:#FFF3C4;color:#7A4E05;border:1.5px solid #F0CE6B;
  border-radius:999px;padding:.15em .7em;font-family:var(--fb);font-size:clamp(13px,1.05vw,18px);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{background:#FFE68A}}

/* ── 본문 격자 ── */
.grid{flex:1;display:grid;gap:clamp(8px,.85vw,14px);
  grid-template-columns:1.05fr 1fr;
  grid-template-areas:"members song" "why posters";align-items:stretch}
@media(max-width:900px){.grid{grid-template-columns:1fr;grid-template-areas:"members" "song" "why" "posters"}}
/* 모둠 모니터(큰 화면): 한 화면에 네 칸이 다 들어오고, 넘치는 내용은 칸 안에서만 넘깁니다 */
@media(min-width:901px){
  body{overflow:hidden}
  .wrap{height:100vh;overflow:hidden;min-height:0}
  #mon{min-height:0}
  .grid{min-height:0;grid-template-rows:1fr 1fr}
  .panel{overflow:auto}
}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:clamp(14px,1.2vw,20px);
  padding:clamp(11px,1.05vw,18px);box-shadow:0 3px 12px rgba(23,130,75,.06);min-width:0;display:flex;flex-direction:column}
.panel.members{grid-area:members}
.panel.song{grid-area:song;background:linear-gradient(#FCFAFF,#fff 130px);border-color:var(--purple-line)}
.panel.why{grid-area:why;background:linear-gradient(#FFFDF7,#fff 130px);border-color:var(--amber-line)}
.panel.posters{grid-area:posters}
.ph{display:flex;align-items:center;gap:.5em;font-family:var(--fb);font-weight:normal;
  font-size:clamp(16px,1.55vw,26px);margin:0 0 .5em;color:var(--green-d)}
.ph small{font-family:var(--fl);font-size:clamp(11px,.85vw,15px);color:var(--grey);margin-left:auto;font-weight:normal}
.song .ph{color:var(--purple)}
.why .ph{color:#7A4E05}

/* ── 모둠원 ── */
.mlist{display:flex;flex-direction:column;gap:.42em;overflow:auto}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:.55em;align-items:center;
  background:var(--mint);border:1px solid var(--line);border-radius:12px;padding:.42em .6em}
.mrow .cre{font-size:1.35em;line-height:1}
.mrow .nm{font-family:var(--fb);font-weight:normal;font-size:clamp(15px,1.35vw,23px)}
.mrow .cr{font-size:clamp(13px,1.05vw,18px);color:var(--green-d)}
.mrow .no{font-size:clamp(11px,.85vw,14px);color:var(--grey);margin-right:.35em}
.mrow .fl{display:flex;gap:.3em;font-size:clamp(11px,.8vw,13px)}
.mrow .fl span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:.05em .45em;color:var(--grey)}
.mrow.new{animation:arrive 2.6s ease}
@keyframes arrive{0%{background:#FFF3C4;transform:scale(.98)}60%{background:#FFF9E2}100%{background:var(--mint)}}
.hero-cre{display:flex;align-items:center;gap:.6em;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:.5em .7em;margin-bottom:.6em}
.hero-cre .e{font-size:2em;line-height:1}
.hero-cre b{font-family:var(--fb);font-weight:normal;font-size:clamp(18px,1.8vw,30px);color:var(--green-d)}
.hero-cre span{color:var(--grey);font-size:clamp(12px,.95vw,16px)}

/* ── 막대 집계 ── */
.tall{display:flex;flex-direction:column;gap:.3em}
.tl{display:grid;grid-template-columns:minmax(4.6em,auto) 1fr auto;gap:.5em;align-items:center;
  font-size:clamp(13px,1.05vw,19px)}
.tl>em{font-style:normal;font-family:var(--fb);font-weight:normal;color:var(--green-d);text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:11em}
.bar{height:.62em;border-radius:999px;background:var(--mint2);overflow:hidden;min-width:2em}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--green-l),var(--green));border-radius:999px}
.tl.win .bar>span{background:linear-gradient(90deg,#F0B429,#E09B12)}
.tl>i{font-style:normal;color:var(--grey);font-size:clamp(11px,.85vw,15px)}

/* ── 칩·인용 ── */
.tags{display:flex;flex-wrap:wrap;gap:.32em}
.tag{background:var(--mint);border:1px solid var(--line);border-radius:999px;padding:.12em .6em;
  font-size:clamp(13px,1.05vw,18px)}
.tag b{font-family:var(--fb);font-weight:normal;color:var(--green-d)}
.tag.p{background:var(--purple-bg);border-color:var(--purple-line);color:var(--purple)}
.tag.p b{color:var(--purple)}
.quotes{display:flex;flex-direction:column;gap:.3em;margin-top:.2em}
.quote{background:#F7FCF9;border-left:3px solid var(--green-l);border-radius:0 10px 10px 0;padding:.32em .6em;
  font-size:clamp(13px,1.05vw,18px);word-break:keep-all}
.quote.amber{background:var(--amber-bg);border-left-color:var(--amber)}
.sh{margin:.7em 0 .28em;font-family:var(--fb);font-weight:normal;font-size:clamp(13px,1.1vw,19px);
  color:var(--green-d);display:flex;align-items:center;gap:.4em}
.sh:first-of-type{margin-top:0}
.sh span{font-family:var(--fl);font-weight:normal;color:var(--grey);font-size:clamp(11px,.82vw,14px)}
.song .sh{color:var(--purple)}
.empty{color:var(--grey);font-size:clamp(13px,1.05vw,18px);padding:.3em 0}

/* ── 포스터 ── */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:.5em;overflow:auto}
.post{margin:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.post img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#EEF5F0}
.post figcaption{font-size:clamp(11px,.85vw,14px);padding:.3em .5em;color:var(--ink);font-family:var(--fb)}
.post figcaption span{display:block;font-family:var(--fl);color:var(--grey);font-size:.9em}
.suno-box{background:var(--purple-bg);border:1.5px solid var(--purple-line);border-radius:12px;padding:.55em .7em;margin-top:.35em}
.suno-box p{margin:0;font-size:clamp(12px,.95vw,17px);word-break:keep-all;color:#3F2D74}
.suno-box code{display:block;margin-top:.35em;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:clamp(10px,.78vw,13px);color:#4A3580;word-break:break-all}
.listen{display:inline-flex;align-items:center;gap:.4em;background:var(--purple);color:#fff;text-decoration:none;
  border-radius:999px;padding:.3em .8em;font-size:clamp(13px,1.05vw,18px);font-family:var(--fb)}
.nolink{color:var(--grey);font-size:clamp(12px,.95vw,17px)}

/* ── 아래 도구줄 ── */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:.45em;font-size:clamp(12px,.92vw,16px);color:var(--grey)}
.tools .sp{flex:1}
.btn{font-family:var(--fl);font-size:inherit;border:1.5px solid var(--line);background:#fff;color:var(--green-d);
  border-radius:999px;padding:.42em 1em;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.on{background:var(--green);border-color:var(--green);color:#fff;font-family:var(--fb)}
.btn:disabled{opacity:.5;cursor:default}
select{font-family:var(--fl);font-size:inherit;border:1.5px solid var(--line);border-radius:999px;
  background:#fff;color:var(--ink);padding:.42em .9em}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#173D2A;color:#fff;
  padding:.6em 1.1em;border-radius:12px;font-size:clamp(13px,1.05vw,18px);opacity:0;pointer-events:none;
  transition:.25s;z-index:60;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ── 시작(반·모둠 고르기) ── */
.pick{max-width:900px;margin:6vh auto;text-align:center}
.pick h1{font-family:var(--fb);font-weight:normal;font-size:clamp(24px,2.6vw,40px);color:var(--green-d);margin:.2em 0}
.pick .chips{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;margin:.9em 0}
.pick .gl{display:grid;grid-template-columns:repeat(4,1fr);gap:.6em;margin-top:1em}
.pick .gl button{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:1em .4em;cursor:pointer;
  font-family:var(--fb);font-size:clamp(18px,1.8vw,28px);color:var(--green-d)}
.pick .gl button:hover{background:var(--mint)}
.pick p{color:var(--grey)}
.wait{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6em;color:var(--grey)}
.wait .big{font-size:clamp(34px,4vw,64px);line-height:1}
.wait b{font-family:var(--fb);font-weight:normal;color:var(--green-d);font-size:clamp(18px,1.8vw,30px)}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <!-- 반·모둠 고르기 (주소에 없을 때만) -->
  <div class="pick" id="pick" hidden>
    <div style="font-family:var(--fb);color:var(--green-d)">📺 모둠 모니터</div>
    <h1>어느 반, 몇 모둠 모니터인가요?</h1>
    <p>학생 화면의 <b>📺 모둠 모니터 열기</b>를 누르면 반·모둠이 저절로 맞춰져요.</p>
    <div class="chips" id="pickClass"></div>
    <div class="gl" id="pickGroup"></div>
  </div>

  <!-- 모니터 본화면 -->
  <div id="mon" hidden style="display:flex;flex-direction:column;gap:clamp(8px,.9vw,16px);flex:1">
    <header class="topbar">
      <div>
        <div class="k">보평중학교 1학년 자유학기 과학 · 생물다양성 캠페인</div>
        <h1><span id="hWho">📺 모둠 모니터</span> <span class="hero" id="hHero" hidden></span></h1>
      </div>
      <div class="right">
        <div class="clock" id="hClock">--:--</div>
        <div class="mini" id="hMini">불러오는 중…</div>
        <div id="hNew"></div>
      </div>
    </header>

    <div class="grid" id="grid" hidden>
      <section class="panel members">
        <h2 class="ph">👥 우리 모둠이 보낸 조사 <small id="mCount"></small></h2>
        <div class="hero-cre" id="mHero" hidden></div>
        <div class="mlist" id="mList"></div>
      </section>

      <section class="panel song">
        <h2 class="ph">🎵 우리 모둠 노래 설계 <small id="sCount"></small></h2>
        <div id="sBody"></div>
      </section>

      <section class="panel why">
        <h2 class="ph">🌏 왜, 무엇을 지킬까 <small id="wCount"></small></h2>
        <div id="wBody"></div>
      </section>

      <section class="panel posters">
        <h2 class="ph">🖼️ 우리 모둠 포스터 <small id="pCount"></small></h2>
        <div class="posts" id="pBody"></div>
      </section>
    </div>

    <div class="wait" id="wait" hidden>
      <div class="big">🌱</div>
      <b>모둠원들이 보내는 중이에요…</b>
      <div>학생 화면에서 <b>🖥️ 모둠 모니터에 보내기</b>를 누르면 여기에 바로 나타나요.</div>
    </div>

    <div class="tools">
      <button class="btn" id="btnReload">🔄 새로고침</button>
      <button class="btn on" id="btnAuto">⏱️ 8초 자동</button>
      <button class="btn" id="btnFull">⛶ 전체 화면 (F11)</button>
      <span class="sp"></span>
      <span id="stamp">–</span>
      <select id="selClass" aria-label="반"></select>
      <select id="selGroup" aria-label="모둠"></select>
      <a class="btn" href="./" style="text-decoration:none">🧪 학생 화면</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 서버 ================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbxTuJxsk-St2YqHocVlbcVCQyIEIp-zIqDbNe9Pw_lmaTIe7xusXqz_Pe34dZ_cq_fYYQ/exec';
var CLASSES = ['2반', '4반'];
var GROUP_N = 8;
var AUTO_MS = 8000;

var $ = function (id) { return document.getElementById(id); };
var state = {
  cls: '', grp: 0, auto: 0, loading: false,
  last: null,        // 이전 화면 숫자(새로 온 것 표시용)
  newNames: {},      // 방금 도착한 학생 번호
  newSong: false, newPoster: false
};

var CRE_EMOJI = {
  '수달': '🦦', '꿀벌': '🐝', '반달가슴곰': '🐻', '맹꽁이': '🐸', '저어새': '🕊️',
  '산호초': '🪸', '구상나무': '🌲', '따오기': '🦩', '하늘다람쥐': '🐿️', '남방큰돌고래': '🐬'
};
function creEmoji(name) { return CRE_EMOJI[name] || '🌿'; }

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
function parseApi_(text) {
  var res;
  try { res = JSON.parse(text); }
  catch (e) { throw new Error('서버 응답을 읽지 못했어요.'); }
  if (res && res.ok === false) throw new Error(res.error || '서버에서 처리하지 못했어요.');
  return res;
}
function apiGet(params) {
  var qs = Object.keys(params).map(function (k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  return fetch(API_URL + '?' + qs + '&_=' + Date.now(), { method: 'GET', redirect: 'follow', cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(parseApi_);
}

/* ================= 주소 읽기 ================= */
function clsFromParam(v) {
  if (!v) return '';
  var n = String(v).replace(/[^0-9]/g, '');
  return n ? (n + '반') : '';
}
function grpFromParam(v) {
  var n = String(v || '').replace(/[^0-9]/g, '');
  n = parseInt(n, 10);
  return (n >= 1 && n <= GROUP_N) ? n : 0;
}
function params() {
  var p = new URLSearchParams(location.search);
  return { cls: clsFromParam(p.get('class') || p.get('cls')), grp: grpFromParam(p.get('group') || p.get('g')) };
}
function setParams(cls, grp) {
  var url = location.pathname + '?class=' + encodeURIComponent(cls) + '&group=' + grp;
  history.replaceState(null, '', url);
  state.cls = cls; state.grp = grp;
  state.last = null; state.newNames = {}; state.newSong = false; state.newPoster = false;
  $('pick').hidden = true; $('mon').hidden = false;
  paintSelects();
  $('hWho').textContent = '📺 ' + cls + ' ' + grp + '모둠';
  document.title = cls + ' ' + grp + '모둠 · 모둠 모니터';
  load();
}

/* ================= 고르기 화면 ================= */
function paintPick() {
  $('pick').hidden = false; $('mon').hidden = true;
  var cb = $('pickClass'); cb.innerHTML = '';
  CLASSES.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (state.cls === c ? ' on' : ''); b.textContent = c;
    b.addEventListener('click', function () { state.cls = c; paintPick(); });
    cb.appendChild(b);
  });
  var gb = $('pickGroup'); gb.innerHTML = '';
  for (var g = 1; g <= GROUP_N; g++) {
    (function (g) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = g + '모둠';
      b.addEventListener('click', function () { setParams(state.cls || CLASSES[0], g); });
      gb.appendChild(b);
    })(g);
  }
  if (!state.cls) state.cls = CLASSES[0];
  paintPickClassOnly();
}
function paintPickClassOnly() {
  var btns = $('pickClass').children;
  for (var i = 0; i < btns.length; i++) btns[i].className = 'btn' + (btns[i].textContent === state.cls ? ' on' : '');
}
function paintSelects() {
  var sc = $('selClass'); sc.innerHTML = '';
  CLASSES.forEach(function (c) { sc.options.add(new Option(c, c)); });
  sc.value = state.cls;
  var sg = $('selGroup'); sg.innerHTML = '';
  for (var g = 1; g <= GROUP_N; g++) sg.options.add(new Option(g + '모둠', String(g)));
  sg.value = String(state.grp);
}

/* ================= 자료 불러오기 ================= */
function load() {
  if (state.loading || !state.cls || !state.grp) return;
  state.loading = true;
  $('btnReload').disabled = true;
  apiGet({ action: 'teacherBoard', classNum: state.cls })
    .then(function (board) {
      return apiGet({ action: 'summary', classNum: state.cls, groupNum: state.grp + '모둠' })
        .then(function (sum) { return { board: board, sum: sum }; })
        .catch(function () { return { board: board, sum: null }; });
    })
    .then(function (r) {
      render(r.board, r.sum);
      $('stamp').textContent = '마지막 ' + hhmmss(new Date()) + (state.auto ? ' · 자동 새로고침 중' : '');
    })
    .catch(function (err) {
      $('stamp').textContent = '불러오지 못했어요 — 새로고침을 눌러 주세요';
      if (!state.last) toast('불러오지 못했어요: ' + (err && err.message ? err.message : '잠시 뒤 다시'));
    })
    .then(function () {
      state.loading = false;
      $('btnReload').disabled = false;
    });
}
function hhmmss(d) {
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* ================= 그리기 ================= */
function findGroup(board, g) {
  var list = (board && board.groups) || [];
  for (var i = 0; i < list.length; i++) if (Number(list[i].group) === Number(g)) return list[i];
  return null;
}
function render(board, sum) {
  var g = findGroup(board, state.grp);
  if (!g) {
    if (!state.last) { $('grid').hidden = true; $('wait').hidden = false; }
    $('hMini').textContent = state.cls + ' ' + state.grp + '모둠 · 아직 보낸 내용이 없어요';
    return;
  }
  var st = (sum && sum.ok) ? sum : null;
  /* 같은 학생이 여러 번 보내면 시트에 줄이 여러 개 쌓입니다 — 모니터에는 사람마다 한 줄로(마지막 것) 보여 줍니다. */
  var raw = g.students || [], seen = {}, students = [];
  for (var ri = 0; ri < raw.length; ri++) {
    var rk = String(raw[ri].number);
    if (seen[rk] !== undefined) students[seen[rk]] = raw[ri];
    else { seen[rk] = students.length; students.push(raw[ri]); }
  }
  var posters = g.posters || [];
  var empty = !students.length && !g.voteCount && !posters.length;

  if (empty) {
    $('hHero').hidden = true;
    $('hNew').innerHTML = '';
    $('hMini').innerHTML = '조사 <b>0명</b> · 투표 <b>0표</b> · 포스터 <b>0장</b>';
    $('grid').hidden = true;
    $('wait').hidden = false;
    state.last = { s: 0, v: 0, p: 0, names: '', main: '' };
    return;
  }

  /* 새로 온 것 표시 */
  var sig = {
    s: students.length, v: g.voteCount, p: posters.length,
    names: students.map(function (s) { return String(s.number); }).join(','),
    main: g.mainCreature || ''
  };
  state.newNames = {}; state.newSong = false; state.newPoster = false;
  var arrived = [];
  if (state.last) {
    var had = (state.last.names ? state.last.names.split(',') : []);
    students.forEach(function (s) {
      if (had.indexOf(String(s.number)) < 0) { state.newNames[String(s.number)] = 1; arrived.push(s.name); }
    });
    if (sig.v > state.last.v) { state.newSong = true; arrived.push('노래 투표'); }
    if (sig.p > state.last.p) { state.newPoster = true; arrived.push('포스터'); }
  }
  var isNewStudent = arrived.length > 0;

  /* 머리 */
  var main = g.mainCreature || (st && st.mainCreature) || '';
  var hh = $('hHero');
  if (main) {
    hh.hidden = false;
    hh.innerHTML = creEmoji(main) + ' ' + esc(main);
    if (state.last && state.last.main && state.last.main !== main) {
      hh.classList.remove('pop'); void hh.offsetWidth; hh.classList.add('pop');
    }
  } else { hh.hidden = true; }

  $('hMini').innerHTML = '조사 <b>' + students.length + '명</b> · 투표 <b>' + (g.voteCount || 0) + '표</b> · 포스터 <b>' +
    posters.length + '장</b>' + (g.suno ? ' · 🎵 노래 링크 있음' : '');
  var hn = $('hNew');
  if (arrived.length) {
    hn.innerHTML = '<span class="badge-new">🆕 방금 도착 · ' + esc(arrived.slice(0, 2).join(' · ')) +
      (arrived.length > 2 ? ' 외 ' + (arrived.length - 2) : '') + '</span>';
    clearTimeout(hn._tm);
    hn._tm = setTimeout(function () { hn.innerHTML = ''; }, 9000);
  }

  /* ① 모둠원 */
  $('mCount').textContent = students.length ? students.length + '명 보냄' : '아직 없음';
  var hero = $('mHero');
  var creTop = (g.creatures || [])[0];
  if (creTop) {
    hero.hidden = false;
    hero.innerHTML = '<span class="e">' + creEmoji(creTop.label) + '</span><div><b>' + esc(creTop.label) +
      '</b><br><span>우리 모둠에서 가장 많이 나온 생물 · ' + students.length + '명 중 1등</span></div>';
  } else { hero.hidden = true; }
  $('mList').innerHTML = students.length
    ? students.slice().sort(function (a, b) { return Number(a.number) - Number(b.number); }).map(function (s) {
        var isNew = state.newNames[String(s.number)];
        return '<div class="mrow' + (isNew ? ' new' : '') + '">' +
          '<span class="cre">' + creEmoji(s.creature) + '</span>' +
          '<div><span class="no">' + esc(s.number) + '번</span><span class="nm">' + esc(s.name) + '</span>' +
          '<div class="cr">' + esc(s.creature || '—') + '</div></div>' +
          '<div class="fl"><span>' + (isNew ? '🆕 도착' : '✅ 조사') + '</span></div>' +
          '</div>';
      }).join('')
    : '<div class="empty">아직 보낸 조사가 없어요.</div>';

  /* ② 노래 */
  $('sCount').textContent = g.voteCount ? g.voteCount + '표 모임' : '아직 없음';
  var s = '';
  if (g.voteCount) {
    s += ['장르', '분위기', '템포', '보컬'].map(function (label, i) {
      var key = ['genre', 'mood', 'tempo', 'vocal'][i];
      return '<div class="sh">' + label + ' 1등</div>' + tally(g[key], '표', 3);
    }).join('');
    s += '<div class="sh">🔑 가사에 넣을 말 <span>많이 나온 순서</span></div>' +
      (g.keywords && g.keywords.length
        ? '<div class="tags">' + g.keywords.map(function (k) {
            return '<span class="tag p"><b>' + esc(k.label) + '</b>' + (k.count > 1 ? ' ' + k.count : '') + '</span>';
          }).join('') + '</div>'
        : '<div class="empty">아직 없어요.</div>');
    s += '<div class="sh">🎤 후렴구 후보</div>' +
      (g.choruses && g.choruses.length
        ? '<div class="quotes">' + g.choruses.slice(0, 3).map(function (c) {
            return '<div class="quote">“' + esc(c.label) + '”</div>';
          }).join('') + '</div>'
        : '<div class="empty">아직 없어요.</div>');
    s += '<div class="suno-box"><p>' + esc(g.sunoKo || '') + '</p><code>' + esc(g.sunoTags || '') + '</code></div>';
  } else {
    s = '<div class="empty">모둠원이 투표를 보내면 장르·분위기·키워드가 여기에 모여요.</div>';
  }
  s += '<div class="sh">🎧 우리 노래</div>' + (g.suno
    ? '<a class="listen" href="' + esc(g.suno.link) + '" target="_blank" rel="noopener">🎵 ' +
      esc(g.suno.title || '수노에서 듣기') + '</a>'
    : '<span class="nolink">아직 수노 링크가 없어요 (선생님이 등록)</span>');
  $('sBody').innerHTML = s;

  /* ③ 왜 · 무엇을 */
  var w = '';
  w += '<div class="sh">🐾 사라지는 이유</div>' +
    (g.reasons && g.reasons.length ? tally(g.reasons, '', 4) : '<div class="empty">아직 없어요.</div>');
  if (st && st.impacts && uniq(st.impacts).length) {
    w += '<div class="sh">🔗 사라지면 생태계에</div><div class="quotes">' +
      uniq(st.impacts).slice(0, 3).map(function (x) { return '<div class="quote amber">' + esc(x) + '</div>'; }).join('') + '</div>';
  }
  if (st && st.actions && st.actions.length) {
    w += '<div class="sh">🙌 우리가 할 수 있는 행동</div><div class="quotes">' +
      st.actions.slice(0, 3).map(function (x) {
        return '<div class="quote">' + esc(x.label) + (x.count > 1 ? ' <span style="color:#6B7B73">×' + x.count + '</span>' : '') + '</div>';
      }).join('') + '</div>';
  }
  if (st && st.slogans && uniq(st.slogans).length) {
    var sl = uniq(st.slogans);
    w += '<div class="sh">📣 우리 포스터 슬로건</div><div class="quotes">' +
      sl.slice(-3).map(function (x) { return '<div class="quote">“' + esc(x) + '”</div>'; }).join('') + '</div>';
  }
  $('wCount').textContent = students.length ? students.length + '명' : '아직 없음';
  $('wBody').innerHTML = w;

  /* ④ 포스터 */
  $('pCount').textContent = posters.length ? posters.length + '장' : '아직 없음';
  $('pBody').innerHTML = posters.length
    ? posters.map(function (p) {
        return '<figure class="post"><img loading="lazy" src="' + esc(p.url) + '" alt="' + esc(p.creature) + ' 포스터">' +
          '<figcaption>' + esc(p.number) + '번 ' + esc(p.name) + '<span>' + esc(p.creature) + '</span></figcaption></figure>';
      }).join('')
    : '<div class="empty">포스터 전시장 탭에서 올리면 여기에 바로 걸려요.</div>';

  state.last = sig;
  $('grid').hidden = false;
  $('wait').hidden = true;
}

function uniq(list) {
  var out = [], got = {};
  (list || []).forEach(function (x) {
    var k = String(x);
    if (!k || got[k]) return;
    got[k] = 1; out.push(x);
  });
  return out;
}

function tally(list, unit, max) {
  if (!list || !list.length) return '<div class="empty">아직 없어요.</div>';
  var top = list[0].count || 1;
  return '<div class="tall">' + list.slice(0, max || 5).map(function (x, i) {
    var w = Math.max(7, Math.round(x.count / top * 100));
    return '<div class="tl' + (i === 0 ? ' win' : '') + '"><em>' + esc(x.label) + '</em>' +
      '<div class="bar"><span style="width:' + w + '%"></span></div><i>' + x.count + unit + '</i></div>';
  }).join('') + '</div>';
}

/* ================= 시계 ================= */
function tickClock() {
  var d = new Date();
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  $('hClock').textContent = p(d.getHours()) + ':' + p(d.getMinutes());
}
setInterval(tickClock, 1000);

/* ================= 자동 새로고침 ================= */
function startAuto() {
  stopAuto();
  state.auto = setInterval(function () {
    if (document.hidden) return;
    load();
  }, AUTO_MS);
  $('btnAuto').className = 'btn on';
  $('btnAuto').textContent = '⏱️ 8초 자동 켜짐';
}
function stopAuto() {
  if (state.auto) { clearInterval(state.auto); state.auto = 0; }
  $('btnAuto').className = 'btn';
  $('btnAuto').textContent = '⏱️ 8초 자동 꺼짐';
}

/* ================= 전체 화면 ================= */
function fullscreen() {
  var el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
    return;
  }
  var fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!fn) { toast('이 브라우저는 ⛶ 버튼을 지원하지 않아요 — F11(크롬북은 Fn+F11)을 눌러 주세요'); return; }
  try {
    var r = fn.call(el);
    if (r && r.catch) r.catch(function () { toast('전체 화면이 막혔어요 — F11을 눌러 주세요'); });
  } catch (e) { toast('전체 화면이 막혔어요 — F11을 눌러 주세요'); }
}

/* ================= 시작 ================= */
(function init() {
  tickClock();
  var p = params();
  $('btnReload').addEventListener('click', function () { load(); });
  $('btnAuto').addEventListener('click', function () { state.auto ? stopAuto() : startAuto(); });
  $('btnFull').addEventListener('click', fullscreen);
  $('selClass').addEventListener('change', function () { setParams(this.value, state.grp || 1); });
  $('selGroup').addEventListener('change', function () { setParams(state.cls, grpFromParam(this.value)); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'F5') return;
    if (e.key === 'r' && (e.altKey || e.metaKey)) { e.preventDefault(); load(); }
  });
  if (p.cls && p.grp) {
    state.cls = p.cls; state.grp = p.grp;
    $('pick').hidden = true;
    $('mon').hidden = false;
    paintSelects();
    $('hWho').textContent = '📺 ' + state.cls + ' ' + state.grp + '모둠';
    document.title = state.cls + ' ' + state.grp + '모둠 · 모둠 모니터';
    load();
    startAuto();
  } else {
    paintPick();
  }
})();
</script>
</body>
</html>
